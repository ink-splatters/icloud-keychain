[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icloud-keychain"
version = "0.0.0"
description = "iCloud Keychain Utility"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Peter A.", email = "ink.splatters@pm.me" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.5.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.36.0",
    "pytest>=8.4.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.4",
    "ty>=0.0.1a21",
    "vulture>=2.16",
    "zizmor>=1.27.0",
]

[project.scripts]
ikc = "icloud_keychain.cli:ikc"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_keychain"]

[tool.poe.tasks]
vulture = "vulture src tests"
typecheck = "ty check src tests"
lint = ["ruff:check", "typecheck", "zizmor"]
check=["lint"]
fix = ["ruff:format", "ruff:fix", "typecheck", "zizmor:fix"]
test = "pytest"
zizmor = "zizmor -p ."

[tool.poe.tasks."zizmor:fix"]
cmd = "zizmor -p --fix=all ."

[tool.poe.tasks."ruff:format"]
cmd = "ruff format"

[tool.poe.tasks."ruff:check"]
cmd = "ruff check"

[tool.poe.tasks."ruff:fix"]
cmd = "ruff check --fix"

[tool.poe]
executor = { type = "uv" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--cov=icloud_keychain",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
